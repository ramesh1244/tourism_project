name: Tourism MLOps Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "tourism_project/**"
      - ".github/workflows/pipeline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tourism_project/requirements.txt

      - name: Validate and register dataset
        run: python tourism_project/model_building/data_register.py

      - name: Upload registered dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  data-preparation:
    name: Data Preparation
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tourism_project/requirements.txt

      - name: Download registered dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data

      - name: Create train and test splits
        run: python tourism_project/model_building/prep.py

      - name: Upload train and test splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: tourism_project/artifacts/data/*.csv

  model-training:
    name: Model Training
    needs: data-preparation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tourism_project/requirements.txt

      - name: Download train and test splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/artifacts/data

      - name: Train and evaluate model
        run: python tourism_project/model_building/train.py

      - name: Upload MLflow runs
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs
          path: tourism_project/mlruns

      - name: Commit trained model and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/wellness_tourism_model.joblib
          git add tourism_project/model_building/model_metrics.json
          git add tourism_project/model_building/classification_report.json
          if git diff --cached --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "Update trained tourism model [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
